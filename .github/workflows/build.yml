name: build-rust-binary

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: checkout-code
        uses: actions/checkout@v4

      - name: rust-setup
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: build-binary
        run: |
          cd crossover-gamepad-fixer
          cargo build --release

      - name: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossover-gamepad-fixer
          path: crossover-gamepad-fixer/target/release/crossover-gamepad-fixer.exe

      - name: get-version
        shell: pwsh
        run: |
          $version = (Get-Content crossover-gamepad-fixer/Cargo.toml | Select-String "version =").Line.Split('"')[1]
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: create-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotently delete release if it exists to allow re-releasing
          gh release delete "v$env:VERSION" --yes --cleanup-tag 2>$null
          gh release create "v$env:VERSION" crossover-gamepad-fixer/target/release/crossover-gamepad-fixer.exe --title "Release v$env:VERSION" --notes "Automated release of the lightweight Rust utility crossover-gamepad-fixer.exe compiled for Windows."
