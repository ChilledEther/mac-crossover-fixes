name: build-rust-binary

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: run-release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: rust
          path: crossover-gamepad-fixer

  build-and-release:
    runs-on: windows-latest
    steps:
      - name: checkout-code
        uses: actions/checkout@v6

      - name: rust-setup
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: build-binary
        run: |
          cd crossover-gamepad-fixer
          cargo build --release

      - name: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossover-gamepad-fixer
          path: crossover-gamepad-fixer/target/release/crossover-gamepad-fixer.exe
